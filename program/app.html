    <script>
      // 모든 기기: 실제 CSS 픽셀 기준으로 반응형 레이아웃
      // is-tablet / is-phone 은 터치 전용 동작(붓 커서, 음성)에만 사용하고 크기는 CSS가 담당
      (function () {
        var root = document.documentElement;
        var meta = document.querySelector("meta[name=\"viewport\"]");
        if (meta) {
          meta.setAttribute(
            "content",
            "width=device-width, initial-scale=1.0, viewport-fit=cover"
          );
        }
        function syncDeviceClass() {
          var touch = (navigator.maxTouchPoints || 0) > 1 || "ontouchstart" in window;
          var coarse = false;
          try { coarse = window.matchMedia("(any-pointer: coarse)").matches; } catch (e) {}
          var shortSide = Math.min(screen.width, screen.height);
          var isTablet = (touch || coarse) && shortSide >= 600;
          var isPhone = (touch || coarse) && shortSide < 600;
          root.classList.toggle("is-tablet", isTablet);
          root.classList.toggle("is-phone", isPhone);
          root.classList.toggle("is-touch", !!(touch || coarse));
          root.classList.toggle("is-desktop", !isTablet && !isPhone);
        }
        syncDeviceClass();
        window.addEventListener("orientationchange", function () { setTimeout(syncDeviceClass, 80); });
        window.addEventListener("resize", syncDeviceClass);
      })();
    </script>
