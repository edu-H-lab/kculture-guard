<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 문화 수호대</title>
  <script src="assets/js/asset-url.js?v=2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Round:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    /* 시작 화면(런처)
       「프로그램 실행하기」 → 앱 본체(app.html)
       배포 후: 맨 아래 ONLINE_URL 에 배포 주소를 넣으면, USB에서 파일로 열었을 때
       버튼이 온라인 주소로 연결됩니다(웹 주소·로컬 서버로 열면 그대로 app.html). */
    :root {
      --ink: #33394a;
      --ink-soft: #6a7184;
      --teal: #1f9c86;
      --teal-deep: #137a69;
      --gold: #ffcf54;
      --gold-deep: #f0ac1b;
      --line: #e6ebef;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Nanum Round", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: var(--ink);
      background: #cfe9f4 url("assets/images/home-bg.webp") center bottom / cover no-repeat;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 70% at 50% 45%, rgba(255,255,255,.78) 0%, rgba(255,255,255,.45) 60%, rgba(255,255,255,.15) 100%);
      pointer-events: none;
    }

    .launcher {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(14px, 3vh, 36px) 16px;
      gap: clamp(8px, 1.8vh, 18px);
      text-align: center;
    }

    .logo {
      display: block;
      height: clamp(180px, 39vh, 400px);
      width: auto;
      max-width: 92vw;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(30, 60, 70, .18));
    }

    .tagline {
      margin: 0;
      max-width: 880px;
      font-size: clamp(1rem, 1.6vw + .4vh, 1.35rem);
      font-weight: 800;
      line-height: 1.5;
      color: var(--ink);
      word-break: keep-all;
    }
    .tagline em { font-style: normal; color: var(--teal-deep); }

    .panel {
      width: min(720px, 100%);
      background: rgba(255, 255, 255, .94);
      border-radius: 22px;
      box-shadow: 0 14px 34px rgba(30, 60, 80, .14);
      padding: clamp(6px, 1vh, 10px) clamp(18px, 2.6vw, 30px);
      text-align: left;
    }
    .row {
      display: grid;
      grid-template-columns: 7.2em 1fr;
      gap: 14px;
      align-items: baseline;
      padding: clamp(9px, 1.5vh, 14px) 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .label {
      font-size: clamp(.8rem, 1vw, .92rem);
      font-weight: 800;
      color: var(--teal);
      white-space: nowrap;
    }
    .value {
      font-size: clamp(.95rem, 1.25vw, 1.08rem);
      font-weight: 800;
      line-height: 1.5;
      word-break: keep-all;
    }
    .value .app-name { color: var(--teal-deep); white-space: nowrap; }
    .value small { font-weight: 700; color: var(--ink-soft); font-size: .92em; }

    .btn-run {
      margin-top: clamp(4px, 1vh, 10px);
      display: inline-flex;
      align-items: center;
      font-family: "Jua", "Malgun Gothic", sans-serif;
      font-size: clamp(1.3rem, 1.8vw + .6vh, 1.75rem);
      color: #fff;
      text-decoration: none;
      padding: 15px 46px;
      border-radius: 999px;
      background: linear-gradient(180deg, #34c3a6 0%, #1faa8e 55%, #17907a 100%);
      box-shadow: 0 6px 0 #0f6f5e, 0 12px 22px rgba(15, 111, 94, .3);
      text-shadow: 0 2px 0 rgba(10, 80, 68, .35);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn-run:hover { transform: translateY(-2px); }
    .btn-run:active { transform: translateY(4px); box-shadow: 0 2px 0 #0f6f5e, 0 6px 12px rgba(15,111,94,.25); }
    .btn-run:focus-visible { outline: 4px solid #0f6f5e; outline-offset: 4px; }

    .btn-local {
      font-size: .88rem;
      font-weight: 700;
      color: var(--ink-soft);
      text-underline-offset: 3px;
    }

    .btn-copyright {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      font-family: "Nanum Round", "Malgun Gothic", sans-serif;
      font-size: .95rem;
      font-weight: 800;
      color: var(--ink);
      background: rgba(255, 255, 255, .92);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(30, 60, 80, .12);
    }
    .btn-copyright:hover { background: #fff; }
    .btn-copyright:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

    .copyright-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(20, 28, 40, .55);
    }
    .copyright-modal[hidden] { display: none; }
    .copyright-dialog {
      width: min(920px, 100%);
      max-height: min(92vh, 920px);
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .28);
      overflow: hidden;
    }
    .copyright-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    .copyright-head h2 {
      margin: 0;
      font-family: "Jua", "Malgun Gothic", sans-serif;
      font-size: 1.2rem;
      font-weight: 400;
    }
    .copyright-close {
      border: 0;
      background: #eef2f5;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 800;
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .copyright-body {
      overflow: auto;
      padding: 12px;
      background: #f4f7f9;
    }
    .copyright-body img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      background: #fff;
    }

    @media (max-width: 560px) {
      .row { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>
  <main class="launcher">
    <h1 style="margin:0">
      <img class="logo" src="assets/images/logo-start.webp" alt="우리 문화 수호대" data-asset-src="assets/images/logo-start.webp" />
    </h1>

    <p class="tagline">우리 문화를 <em>디지털로 체험</em>하고 문화의 가치를 <em>현재의 나와 연결</em>하는 수업 도우미입니다.</p>

    <section class="panel" aria-label="작품 정보">
      <div class="row">
        <span class="label">연구보고서</span>
        <span class="value">디지털로 넓히는 교실, 체험에서 사고로 확장되는 우리 문화 교육 <span class="app-name">「우리 문화 수호대」</span></span>
      </div>
      <div class="row">
        <span class="label">대상 학년</span>
        <span class="value">초등학교 1학년</span>
      </div>
      <div class="row">
        <span class="label">관련 교과</span>
        <span class="value">통합 <small>(즐거운 생활 · 슬기로운 생활 · 바른 생활)</small></span>
      </div>
    </section>

    <a class="btn-run" id="runBtn" href="app.html">프로그램 실행하기</a>
    <button type="button" class="btn-copyright" id="copyrightBtn">저작권</button>
    <a class="btn-local" id="localBtn" href="app.html" hidden>이 컴퓨터에서 실행하기(오프라인 시연)</a>
  </main>

  <div class="copyright-modal" id="copyrightModal" hidden>
    <div class="copyright-dialog" role="dialog" aria-modal="true" aria-labelledby="copyrightTitle">
      <div class="copyright-head">
        <h2 id="copyrightTitle">저작권 증빙자료</h2>
        <button type="button" class="copyright-close" id="copyrightClose">닫기</button>
      </div>
      <div class="copyright-body">
        <img src="assets/images/copyright-proof.png" alt="저작권 증빙목록" data-asset-src="assets/images/copyright-proof.png" />
      </div>
    </div>
  </div>

  <script>
    // 배포 후 여기에 온라인 주소를 넣으세요. 예) var ONLINE_URL = "https://kculture-guard2.vercel.app/app.html";
    var ONLINE_URL = "https://kculture-guard2.vercel.app/app.html";
    // USB에서 파일로 연 경우에만 온라인 주소로 보내고, 오프라인 시연 링크를 함께 보여 줍니다.
    if (ONLINE_URL && location.protocol === "file:") {
      document.getElementById("runBtn").href = ONLINE_URL;
      document.getElementById("localBtn").hidden = false;
    }

    (function () {
      var btn = document.getElementById("copyrightBtn");
      var modal = document.getElementById("copyrightModal");
      var closeBtn = document.getElementById("copyrightClose");
      if (!btn || !modal || !closeBtn) return;
      function openModal() {
        modal.hidden = false;
        closeBtn.focus();
      }
      function closeModal() {
        modal.hidden = true;
        btn.focus();
      }
      btn.addEventListener("click", openModal);
      closeBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", function (e) {
        if (e.target === modal) closeModal();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !modal.hidden) closeModal();
      });
    })();

    (function () {
      function setBg(url) {
        if (!url) return;
        document.body.style.backgroundImage = 'url("' + url + '")';
        document.body.style.backgroundPosition = "center bottom";
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundRepeat = "no-repeat";
      }
      if (typeof pickAssetUrl === "function") {
        pickAssetUrl(["assets/images/home-bg.webp", "assets/images/home-bg.png"], setBg);
      } else {
        setBg("assets/images/home-bg.webp");
      }
    })();
  </script>
</body>
</html>
