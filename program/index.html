<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 문화 수호대</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Round:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    /* ───────── 시작 화면(런처) ─────────
       「프로그램 실행하기」 → 앱 본체(app.html)
       배포 후: 맨 아래 ONLINE_URL 에 배포 주소를 넣으면, USB에서 파일로 열었을 때
       버튼이 온라인 주소로 연결됩니다(웹 주소·로컬 서버로 열면 그대로 app.html). */
    :root {
      --ink: #33394a;
      --ink-soft: #6a7184;
      --teal: #1f9c86;
      --teal-deep: #137a69;
      --gold: #ffcf54;
      --gold-deep: #f0ac1b;
      --line: #e6ebef;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Nanum Round", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: var(--ink);
      background: #cfe9f4 url("assets/images/home-bg.webp") center bottom / cover no-repeat;
      overflow-x: hidden;
    }
    /* 배경을 한 톤 밝게 눌러 글이 잘 보이도록 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 70% at 50% 45%, rgba(255,255,255,.78) 0%, rgba(255,255,255,.45) 60%, rgba(255,255,255,.15) 100%);
      pointer-events: none;
    }

    .launcher {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(14px, 3vh, 36px) 16px;
      gap: clamp(8px, 1.8vh, 18px);
      text-align: center;
    }

    .logo {
      display: block;
      height: clamp(180px, 39vh, 400px);
      width: auto;
      max-width: 92vw;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(30, 60, 70, .18));
    }

    .tagline {
      margin: 0;
      max-width: 880px;
      font-size: clamp(1rem, 1.6vw + .4vh, 1.35rem);
      font-weight: 800;
      line-height: 1.5;
      color: var(--ink);
      word-break: keep-all;
    }
    .tagline em { font-style: normal; color: var(--teal-deep); }

    .panel {
      width: min(720px, 100%);
      background: rgba(255, 255, 255, .94);
      border-radius: 22px;
      box-shadow: 0 14px 34px rgba(30, 60, 80, .14);
      padding: clamp(6px, 1vh, 10px) clamp(18px, 2.6vw, 30px);
      text-align: left;
    }
    .row {
      display: grid;
      grid-template-columns: 7.2em 1fr;
      gap: 14px;
      align-items: baseline;
      padding: clamp(9px, 1.5vh, 14px) 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .label {
      font-size: clamp(.8rem, 1vw, .92rem);
      font-weight: 800;
      color: var(--teal);
      white-space: nowrap;
    }
    .value {
      font-size: clamp(.95rem, 1.25vw, 1.08rem);
      font-weight: 800;
      line-height: 1.5;
      word-break: keep-all;
    }
    .value .app-name { color: var(--teal-deep); white-space: nowrap; }
    .value small { font-weight: 700; color: var(--ink-soft); font-size: .92em; }

    .btn-run {
      margin-top: clamp(4px, 1vh, 10px);
      display: inline-flex;
      align-items: center;
      font-family: "Jua", "Malgun Gothic", sans-serif;
      font-size: clamp(1.3rem, 1.8vw + .6vh, 1.75rem);
      color: #fff;
      text-decoration: none;
      padding: 15px 46px;
      border-radius: 999px;
      background: linear-gradient(180deg, #34c3a6 0%, #1faa8e 55%, #17907a 100%);
      box-shadow: 0 6px 0 #0f6f5e, 0 12px 22px rgba(15, 111, 94, .3);
      text-shadow: 0 2px 0 rgba(10, 80, 68, .35);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn-run:hover { transform: translateY(-2px); }
    .btn-run:active { transform: translateY(4px); box-shadow: 0 2px 0 #0f6f5e, 0 6px 12px rgba(15,111,94,.25); }
    .btn-run:focus-visible { outline: 4px solid #0f6f5e; outline-offset: 4px; }

    .btn-local {
      font-size: .88rem;
      font-weight: 700;
      color: var(--ink-soft);
      text-underline-offset: 3px;
    }

    @media (max-width: 560px) {
      .row { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>
  <main class="launcher">
    <h1 style="margin:0">
      <img class="logo" src="assets/images/logo-start.webp" alt="우리 문화 수호대" />
    </h1>

    <p class="tagline">우리 문화를 <em>디지털로 체험</em>하고 문화의 가치를 <em>현재의 나와 연결</em>하는 수업 도우미입니다.</p>

    <section class="panel" aria-label="작품 정보">
      <div class="row">
        <span class="label">연구보고서</span>
        <span class="value">디지털로 넓히는 교실, 체험에서 사고로 확장되는 우리 문화 교육 <span class="app-name">「우리 문화 수호대」</span></span>
      </div>
      <div class="row">
        <span class="label">대상 학년</span>
        <span class="value">초등학교 1학년</span>
      </div>
      <div class="row">
        <span class="label">관련 교과</span>
        <span class="value">통합 <small>(즐거운 생활 · 슬기로운 생활 · 바른 생활)</small></span>
      </div>
    </section>

    <a class="btn-run" id="runBtn" href="app.html">프로그램 실행하기</a>
    <a class="btn-local" id="localBtn" href="app.html" hidden>이 컴퓨터에서 실행하기(오프라인 시연)</a>
  </main>

  <script>
    var ONLINE_URL = "https://kculture-guard-mu.vercel.app/app.html";
    // USB에서 파일로 연 경우에만 온라인 주소로 보내고, 오프라인 시연 링크를 함께 보여 줍니다.
    if (ONLINE_URL && location.protocol === "file:") {
      document.getElementById("runBtn").href = ONLINE_URL;
      document.getElementById("localBtn").hidden = false;
    }
  </script>
</body>
</html>
